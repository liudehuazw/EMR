# ============================================================
#  电子病历系统 - 一键容器化部署（docker compose）
# ============================================================
#  默认启动 MySQL + Redis + 后端 + 前端：
#      docker compose up -d
#
#  需要 OCR（图片/PDF 文字识别）时（镜像较大，建议宿主机空闲内存 ≥ 2GB）：
#      docker compose --profile ocr up -d
#
#  访问地址：http://localhost:8088     默认账号 admin / admin
#
#  可选：复制根目录 .env.example 为 .env；默认本地存储，无需 OSS 即可上传。
#        OCR 需 --profile ocr；AI 需在系统设置中配置。OSS 为可选增强。
#
#  注意：数据库初始化只在 mysql 数据卷为空的**首次**启动时执行，
#        之后修改 init.sql 不会自动生效，需手动执行迁移脚本。
# ============================================================

services:
  # ---------------- MySQL ----------------
  mysql:
    image: mysql:8.0
    container_name: emr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-emr_root_2024}
      MYSQL_DATABASE: emr_db
      MYSQL_USER: ${MYSQL_USER:-emr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-emr_password_2024}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # init.sql 已自包含全部表与字段，首次启动自动建库建表
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - emr-network

  # ---------------- Redis 缓存 ----------------
  redis:
    image: redis:7-alpine
    container_name: emr-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-emr_redis_2024}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - emr-network

  # ---------------- Spring Boot 后端 ----------------
  backend:
    build:
      context: ./backend
    container_name: emr-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/emr_db?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-emr}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-emr_password_2024}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-emr_redis_2024}
      JWT_SECRET: ${JWT_SECRET:-emr-docker-dev-secret-change-me-at-least-32-bytes}
      FILE_UPLOAD_PATH: /app/uploads
      FILE_STORAGE_TYPE: ${FILE_STORAGE_TYPE:-local}
      OCR_SERVICE_URL: http://ocr:8000
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      ALIYUN_OSS_BUCKET_NAME: ${ALIYUN_OSS_BUCKET_NAME:-}
    ports:
      - "8081:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - emr-network

  # ---------------- 前端（Nginx 托管 + API 反代） ----------------
  frontend:
    build:
      context: ./frontend-vite
    container_name: emr-frontend
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - backend
    networks:
      - emr-network

  # ---------------- OCR 服务（可选，--profile ocr 启用） ----------------
  ocr:
    profiles: ["ocr"]
    build:
      context: ./backend/ocr-service
    container_name: emr-ocr
    restart: unless-stopped
    environment:
      FLAGS_use_mkldnn: "0"
    ports:
      - "8000:8000"
    networks:
      - emr-network

volumes:
  mysql_data:
  redis_data:
  uploads_data:

networks:
  emr-network:
    driver: bridge
