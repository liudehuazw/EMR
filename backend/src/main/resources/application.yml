server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: electronic-medical-record
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/emr_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:}
    
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  # Redis 缓存配置（连接宝塔Docker Redis，端口26739）
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:26739}
    password: ${REDIS_PASSWORD:}
    timeout: 3000ms
    database: 0

# 缓存配置
cache:
  ttl:
    patients: 300        # 患者数据缓存5分钟
    lab-reports: 300     # 检验报告缓存5分钟
    imaging-reports: 300 # 影像报告缓存5分钟
    invoices: 300        # 发票缓存5分钟
    medical-records: 300 # 病历缓存5分钟
    users: 1800          # 用户信息缓存30分钟

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/*.xml

# JWT配置
jwt:
  secret: ${JWT_SECRET:emr-dev-secret-do-not-use-in-prod}
  expiration: 86400000 # 24小时

# 文件上传配置
file:
  upload-path: ./uploads/
  max-size: 52428800 # 50MB

# OCR服务配置
ocr:
  service:
    url: http://localhost:8000
    timeout: 300000 # 5分钟超时（处理多页PDF）

# 智谱AI配置
zhipu:
  ai:
    api-key: ${DEEPSEEK_API_KEY:}
    api-url: https://api.deepseek.com/v1/chat/completions
    model: deepseek-v4-flash
    timeout: ${DEEPSEEK_API_KEY_TIMEOUT:300000}

# 阿里云OSS配置
aliyun:
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:your-bucket-name}
