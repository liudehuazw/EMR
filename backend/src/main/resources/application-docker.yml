# ============================================================
#  docker profile 配置（供 docker-compose / 容器化部署使用）
#  所有敏感项通过环境变量注入，见 docker-compose.yml
# ============================================================
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: electronic-medical-record

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/emr_db?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  # Redis 缓存（容器内默认连接服务名 redis；连不上会自动降级为直接查库）
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 3000ms
    database: 0

# 缓存 TTL（秒）
cache:
  ttl:
    patients: 300
    lab-reports: 300
    imaging-reports: 300
    invoices: 300
    medical-records: 300
    users: 1800

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/*.xml

# JWT（HS256 要求密钥 ≥ 32 字节，生产环境务必通过环境变量覆盖）
jwt:
  secret: ${JWT_SECRET:emr-docker-dev-secret-change-me-at-least-32-bytes}
  expiration: 86400000

# 文件上传
file:
  upload-path: ${FILE_UPLOAD_PATH:/app/uploads}
  max-size: 52428800

# OCR 服务（容器内默认连接服务名 ocr）
ocr:
  service:
    url: ${OCR_SERVICE_URL:http://ocr:8000}
    timeout: 720000

# AI 报告分析 / AI 就诊助手（不配置 Key 时该功能不可用，其余功能正常）
zhipu:
  ai:
    api-key: ${DEEPSEEK_API_KEY:}
    api-url: ${AI_API_URL:https://api.deepseek.com/v1/chat/completions}
    model: ${AI_MODEL:deepseek-v4-flash}
    timeout: ${AI_TIMEOUT:300000}

# 阿里云 OSS（不配置时无法上传文件，其余功能正常）
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:}

logging:
  level:
    com.medical.emr: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
